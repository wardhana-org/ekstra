# Copy this file to docker-compose.local.dev.yml for daily local development.
# This mode uses bind mounts and dev servers for fast feedback.

name: ekstra-local-dev

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ekstra

  frontend:
    image: node:24-alpine
    working_dir: /app
    environment:
      BACKEND_API_URL: http://backend:8080
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    expose:
      - "3000"
    networks:
      - ekstra

  backend:
    image: golang:1.26-alpine
    working_dir: /app
    environment:
      APP_ENV: local
      APP_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ekstra_database
      DB_SSLMODE: disable
      TRUSTED_PROXIES: 172.16.0.0/12
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_DOMAIN: ""
      AUTH_COOKIE_SAME_SITE: lax
    volumes:
      - ./backend:/app
      - go_mod:/go/pkg/mod
      - go_build:/root/.cache/go-build
    command: sh -c "apk add --no-cache git && go mod download && go run ./cmd/api"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - ekstra

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ekstra_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ekstra_database"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ekstra

  migrate:
    image: migrate/migrate:v4.18.3
    profiles:
      - tools
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:postgres@db:5432/ekstra_database?sslmode=disable",
        "up",
      ]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ekstra

networks:
  ekstra:

volumes:
  frontend_node_modules:
  frontend_next:
  go_mod:
  go_build:
  postgres_data:
